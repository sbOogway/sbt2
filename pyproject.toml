[project]
name = "sbt2"
dynamic = ["version"]
description = "Backtesting framework on nautilus_trader"
license = "LGPL-3.0-or-later"
license-files = ["COPYING", "COPYING.LESSER"]
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.6",
    "httpx>=0.28.1",
    "nautilus-trader[visualization]==2.0.0rc6.dev20260927",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "typer>=0.27.2",
]

[project.scripts]
sbt2 = "sbt2.cli:app"

[build-system]
requires = ["hatchling>=1.27", "uv-dynamic-versioning>=0.8"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/sbt2", "src/strategies"]

[tool.hatch.build.targets.sdist]
include = ["/src"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "nautech"
url = "https://packages.nautechsystems.io/simple"
explicit = true

[tool.uv.sources]
nautilus-trader = { index = "nautech" }

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pyright]
include = ["src", "tests"]
reportDeprecated = "error"

[tool.ruff.lint]
extend-select = [
    "ARG", "B", "C4", "C90", "DTZ", "ERA", "FBT", "FURB", "G", "LOG", "PERF", "PGH", "PIE",
    "PLR0913", "PLR0915", "PLR0917", "PLR2004", "PT", "PTH", "RET", "RUF", "SIM",
    "S", "SLF", "T20", "TID", "UP",
]
ignore = [
    # nautilus constructors take their flags positionally
    "FBT003",
    # concatenation splits a long CLI argument list into rows of related options
    "RUF005",
    # the run child's order arrives pickled; off until #136 sends it as JSON
    "S301",
    # the systemd launcher builds its systemd-run arguments; off until #137 moves it to D-Bus
    "S603",
]

[tool.ruff.lint.per-file-ignores]
# Typer reads each command option from a parameter of its own
"src/sbt2/cli.py" = ["FBT001", "FBT002", "PLR0913", "PLR0917"]
# pytest hands fixtures in as arguments
"**/test_*.py" = ["PLR0913", "PLR0917"]
"**/conftest.py" = ["PLR0913", "PLR0917"]
# tests spell out their expected values; the security rules guard shipped code
"tests/**" = ["PLR2004", "S"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 3
max-positional-args = 3

[tool.importlinter]
root_package = "sbt2"
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Higher packages may import lower ones, never the reverse"
type = "layers"
layers = [
    "sbt2.cli",
    "sbt2.run",
    "sbt2.results",
    "sbt2.spec",
    "sbt2.data | sbt2.strategy | sbt2.assets | sbt2.config",
]

[[tool.importlinter.contracts]]
name = "Only sbt2.assets imports its own internals"
type = "protected"
protected_modules = ["sbt2.assets.*"]
allowed_importers = ["sbt2.assets"]

[[tool.importlinter.contracts]]
name = "Only sbt2.data imports its own internals"
type = "protected"
protected_modules = ["sbt2.data.*"]
allowed_importers = ["sbt2.data"]

[[tool.importlinter.contracts]]
name = "Only sbt2.results imports its own internals"
type = "protected"
protected_modules = ["sbt2.results.*"]
allowed_importers = ["sbt2.results"]

[[tool.importlinter.contracts]]
name = "Only sbt2.run imports its own internals"
type = "protected"
protected_modules = ["sbt2.run.*"]
allowed_importers = ["sbt2.run"]

[[tool.importlinter.contracts]]
name = "Only sbt2.spec imports its own internals"
type = "protected"
protected_modules = ["sbt2.spec.*"]
allowed_importers = ["sbt2.spec"]

[[tool.importlinter.contracts]]
name = "Only sbt2.strategy imports its own internals"
type = "protected"
protected_modules = ["sbt2.strategy.*"]
allowed_importers = ["sbt2.strategy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not live and not realdata and not systemd"]
filterwarnings = ["error"]
markers = [
    "unit: exercises one module on its own, with test doubles or fixture data for the rest",
    "integration: exercises modules working together, or strategies and data inside a running Nautilus engine",
    "e2e: drives a command through the CLI, from spec or raw files to stored output",
    "characterization: pins behavior of a third-party dependency sbt2 relies on",
    "golden: a fixed spec that must keep producing the same numbers",
    "live: reaches a real data source over the network; run with -m live",
    "realdata: runs on a month of real data in data/, fetching what it lacks; run with -m realdata",
    "systemd: needs systemd-run and a systemd user session; run with -m systemd",
]

[tool.coverage.run]
source = ["sbt2", "strategies"]
branch = true
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.git-cliff.git]
conventional_commits = true
filter_unconventional = true
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
# Pull requests land as merge commits titled "type(scope): summary (#N)";
# keeping only those lists each change once instead of once per branch commit.
commit_parsers = [
    { message = "^feat.*\\(#[0-9]+\\)(\n|$)", group = "Features" },
    { message = "^fix.*\\(#[0-9]+\\)(\n|$)", group = "Bug fixes" },
    { message = "^perf.*\\(#[0-9]+\\)(\n|$)", group = "Performance" },
    { message = "^refactor.*\\(#[0-9]+\\)(\n|$)", group = "Refactoring" },
    { message = "^revert.*\\(#[0-9]+\\)(\n|$)", group = "Reverts" },
    { message = ".*", skip = true },
]

[tool.git-cliff.bump]
features_always_bump_minor = false
breaking_always_bump_major = false
initial_tag = "v0.1.0"
