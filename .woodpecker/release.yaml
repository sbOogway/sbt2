when:
  - event: push
    branch: main

variables:
  - &image ghcr.io/astral-sh/uv:0.12.19-python3.14-trixie
  - &cache sbt2-cache-release:/cache:z

steps:
  # one step, because this agent doesn't let a step read files another step's container wrote
  - name: release
    image: *image
    environment:
      UV_LINK_MODE: copy
      UV_PYTHON_DOWNLOADS: never
      DEBIAN_FRONTEND: noninteractive
      XDG_CACHE_HOME: /cache
      GH_TOKEN:
        from_secret: github_token
    volumes: [*cache]
    commands:
      # a shallow clone would hide the last tag the next version is computed from
      - git fetch --quiet --tags --unshallow 2>/dev/null || git fetch --quiet --tags
      # the build runs third-party build backends, which have no use for the token
      - env -u GH_TOKEN scripts/prepare-release.sh .release
      - '[ -f .release/tag ] || exit 0'
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends gh
      - >
        gh release create "$(cat .release/tag)" .release/dist/*
        --repo "$CI_REPO" --target "$CI_COMMIT_SHA"
        --title "$(cat .release/tag)" --notes-file .release/notes.md
