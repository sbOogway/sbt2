when:
  - event: push
    branch: main

depends_on:
  - ci

variables:
  - &image ghcr.io/astral-sh/uv:0.12.19-python3.14-trixie

steps:
  - name: prepare
    image: *image
    environment:
      UV_LINK_MODE: copy
      UV_PYTHON_DOWNLOADS: never
    commands:
      # a shallow clone would hide the last tag the next version is computed from
      - git fetch --quiet --tags --unshallow || git fetch --quiet --tags
      - scripts/prepare-release.sh .release

  - name: publish
    image: alpine:3.22
    environment:
      GH_TOKEN:
        from_secret: github_release_token
    commands:
      - '[ -f .release/tag ] || exit 0'
      - apk add --no-cache github-cli
      - >
        gh release create "$(cat .release/tag)" .release/dist/*
        --repo "$CI_REPO" --target "$CI_COMMIT_SHA"
        --title "$(cat .release/tag)" --notes-file .release/notes.md
