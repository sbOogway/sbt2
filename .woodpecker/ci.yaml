when:
  - event: pull_request
  - event: push
    branch: main
  - event: manual

variables:
  - &image ghcr.io/astral-sh/uv:0.12.19-python3.14-trixie
  - &env
    UV_PYTHON_DOWNLOADS: never
    # parallel steps share the checkout, but each has its own /cache volume
    UV_PROJECT_ENVIRONMENT: /cache/venv
    COVERAGE_FILE: /cache/.coverage
    # uv, prek, pyright's Node.js and codecov-cli all keep their caches under it
    XDG_CACHE_HOME: /cache
  - &backend
    - event: pull_request
      path:
        - sbt2-backend/**
        - '{.woodpecker,.github,scripts}/**'
        - '{.*,Makefile,*.toml,*.yaml,*.yml,*.lock}'
    - event: [push, manual]
  - &protocol
    - event: pull_request
      path:
        - sbt2-protocol/**
        - '{.woodpecker,.github,scripts}/**'
        - '{.*,Makefile,*.toml,*.yaml,*.yml,*.lock}'
    - event: [push, manual]
  - &gui
    - event: pull_request
      path:
        - sbt2-gui/**
        - sbt2-protocol/**
        - '{.woodpecker,.github,scripts}/**'
        - '{.*,Makefile,*.toml,*.yaml,*.yml,*.lock}'
    - event: [push, manual]
  - &gui_e2e
    - event: pull_request
      path:
        - sbt2-gui/**
        - sbt2-protocol/**
        - sbt2-backend/**
        - '{.woodpecker,.github,scripts}/**'
        - '{.*,Makefile,*.toml,*.yaml,*.yml,*.lock}'
    - event: [push, manual]
  - &backend_or_protocol
    - event: pull_request
      path:
        - sbt2-backend/**
        - sbt2-protocol/**
        - '{.woodpecker,.github,scripts}/**'
        - '{.*,Makefile,*.toml,*.yaml,*.yml,*.lock}'
    - event: [push, manual]

# One workflow per pipeline: the agent runs one workflow at a time, so pipelines queue whole instead of interleaving.
# Each step has its own cache volume because concurrent containers use different SELinux labels.
steps:
  - name: repo-hooks
    image: *image
    environment: *env
    volumes: [sbt2-cache-repo-hooks:/cache:z]
    depends_on: []
    commands:
      - |
        for hook in check-toml check-yaml end-of-file-fixer trailing-whitespace check-added-large-files shellcheck shfmt; do
          uvx prek@0.5.4 run "$hook" --all-files --show-diff-on-failure
        done

  - name: generate-protocol
    image: *image
    environment: *env
    volumes: [sbt2-cache-generate-protocol:/cache:z]
    depends_on: []
    when: *backend_or_protocol
    commands:
      - uv --directory sbt2-backend sync --locked
      - uvx prek@0.5.4 run generate-protocol --all-files --show-diff-on-failure

  - name: backend-lint
    image: *image
    environment: *env
    volumes: [sbt2-cache-lint:/cache:z]
    depends_on: []
    when: *backend
    commands:
      - uv --directory sbt2-backend sync --locked
      - |
        for hook in ruff-check ruff-format pyright import-linter; do
          uvx prek@0.5.4 run "$hook" --all-files --show-diff-on-failure
        done

  # each package is tested with only its declared dependencies
  - name: test-sbt2-core
    image: *image
    environment:
      <<: *env
      CODECOV_TOKEN:
        from_secret: codecov_token
    volumes: [sbt2-cache-test-sbt2-core:/cache:z]
    depends_on: []
    when: *backend
    commands:
      # only the member and what it declares, so an undeclared dependency fails here
      - uv --directory sbt2-backend sync --locked --package sbt2-core
      - |
        status=0
        env -u CODECOV_TOKEN uv --directory sbt2-backend run --locked --package sbt2-core pytest packages/sbt2-core/tests --cov --cov-config=packages/sbt2-core/pyproject.toml --cov-report=term --cov-report=xml:/cache/coverage.xml --junitxml=/cache/junit.xml -o junit_family=legacy -m "not live and not characterization and not realdata and not systemd" || status=$?
        uvx --from codecov-cli==11.3.1 codecovcli upload-process --git-service github --report-type test_results --flag sbt2-core --file /cache/junit.xml --disable-search || true
        uvx --from codecov-cli==11.3.1 codecovcli upload-process --git-service github --flag sbt2-core --file /cache/coverage.xml || true
        exit $status

  - name: test-sbt2-strategies
    image: *image
    environment:
      <<: *env
      CODECOV_TOKEN:
        from_secret: codecov_token
    volumes: [sbt2-cache-test-sbt2-strategies:/cache:z]
    depends_on: []
    when: *backend
    commands:
      # only the member and what it declares, so an undeclared dependency fails here
      - uv --directory sbt2-backend sync --locked --package sbt2-strategies
      - |
        status=0
        env -u CODECOV_TOKEN uv --directory sbt2-backend run --locked --package sbt2-strategies pytest packages/sbt2-strategies/tests --cov --cov-config=packages/sbt2-strategies/pyproject.toml --cov-report=term --cov-report=xml:/cache/coverage.xml --junitxml=/cache/junit.xml -o junit_family=legacy -m "not live and not characterization and not realdata and not systemd" || status=$?
        uvx --from codecov-cli==11.3.1 codecovcli upload-process --git-service github --report-type test_results --flag sbt2-strategies --file /cache/junit.xml --disable-search || true
        uvx --from codecov-cli==11.3.1 codecovcli upload-process --git-service github --flag sbt2-strategies --file /cache/coverage.xml || true
        exit $status

  - name: test-sbt2-server
    image: *image
    environment:
      <<: *env
      CODECOV_TOKEN:
        from_secret: codecov_token
    volumes: [sbt2-cache-test-sbt2-server:/cache:z]
    depends_on: []
    when: *backend
    commands:
      # only the member and what it declares, so an undeclared dependency fails here
      - uv --directory sbt2-backend sync --locked --package sbt2-server
      - |
        status=0
        env -u CODECOV_TOKEN uv --directory sbt2-backend run --locked --package sbt2-server pytest packages/sbt2-server/tests --cov --cov-config=packages/sbt2-server/pyproject.toml --cov-report=term --cov-report=xml:/cache/coverage.xml --junitxml=/cache/junit.xml -o junit_family=legacy -m "not live and not characterization and not realdata and not systemd" || status=$?
        uvx --from codecov-cli==11.3.1 codecovcli upload-process --git-service github --report-type test_results --flag sbt2-server --file /cache/junit.xml --disable-search || true
        uvx --from codecov-cli==11.3.1 codecovcli upload-process --git-service github --flag sbt2-server --file /cache/coverage.xml || true
        exit $status

  - name: test-sbt2-papers
    image: *image
    environment:
      <<: *env
      CODECOV_TOKEN:
        from_secret: codecov_token
    volumes: [sbt2-cache-test-sbt2-papers:/cache:z]
    depends_on: []
    when: *backend
    commands:
      # only the member and what it declares, so an undeclared dependency fails here
      - uv --directory sbt2-backend sync --locked --package sbt2-papers
      - |
        status=0
        env -u CODECOV_TOKEN uv --directory sbt2-backend run --locked --package sbt2-papers pytest packages/sbt2-papers/tests --cov --cov-config=packages/sbt2-papers/pyproject.toml --cov-report=term --cov-report=xml:/cache/coverage.xml --junitxml=/cache/junit.xml -o junit_family=legacy -m "not live and not characterization and not realdata and not systemd" || status=$?
        uvx --from codecov-cli==11.3.1 codecovcli upload-process --git-service github --report-type test_results --flag sbt2-papers --file /cache/junit.xml --disable-search || true
        uvx --from codecov-cli==11.3.1 codecovcli upload-process --git-service github --flag sbt2-papers --file /cache/coverage.xml || true
        exit $status

  # the root tests span the members, so they run with the whole workspace
  - name: test
    image: *image
    environment:
      <<: *env
      CODECOV_TOKEN:
        from_secret: codecov_token
    volumes: [sbt2-cache-test:/cache:z]
    depends_on: []
    when: *backend
    commands:
      - uv --directory sbt2-backend sync --locked
      # the test results go up even when tests fail, so Test Analytics sees the failures
      # a Codecov outage must not fail the pipeline (temporary)
      - |
        status=0
        # the tests have no use for the token
        env -u CODECOV_TOKEN uv --directory sbt2-backend run --locked pytest tests --junitxml=/cache/junit.xml -o junit_family=legacy -m "not live and not characterization and not realdata and not systemd and not container" || status=$?
        uvx --from codecov-cli==11.3.1 codecovcli upload-process --git-service github --report-type test_results --flag tests --file /cache/junit.xml --disable-search || true
        exit $status

  - name: characterization
    image: *image
    environment:
      <<: *env
      CODECOV_TOKEN:
        from_secret: codecov_token
    volumes: [sbt2-cache-characterization:/cache:z]
    depends_on: []
    when: *backend
    commands:
      - uv --directory sbt2-backend sync --locked
      - |
        status=0
        env -u CODECOV_TOKEN uv --directory sbt2-backend run --locked pytest --junitxml=/cache/junit.xml -o junit_family=legacy -m "characterization and not systemd" || status=$?
        uvx --from codecov-cli==11.3.1 codecovcli upload-process --git-service github --report-type test_results --flag characterization --file /cache/junit.xml --disable-search || true
        exit $status

  # checks that the server's image builds; it is pushed nowhere
  - name: image
    image: quay.io/buildah/stable:v1.43.4
    # the slowest step; on pull requests it runs only when the image's recipe or dependencies change
    when:
      - event: pull_request
        path:
          - sbt2-backend/Containerfile
          - sbt2-backend/.dockerignore
          - sbt2-backend/uv.lock
          - sbt2-backend/**/pyproject.toml
          - .woodpecker/ci.yaml
      - event: [push, manual]
    environment:
      # an unprivileged step can neither mount overlays nor set up namespaces
      STORAGE_DRIVER: vfs
      BUILDAH_ISOLATION: chroot
      # buildah keeps the RUN --mount=type=cache folders, uv's cache among them, under it
      TMPDIR: /cache/tmp
      XDG_CACHE_HOME: /cache
    volumes: [sbt2-cache-image:/cache:z]
    depends_on: []
    commands:
      - mkdir -p /cache/tmp
      - buildah --root=/cache/storage build --format=docker --tag=sbt2-server:ci --file=sbt2-backend/Containerfile sbt2-backend
      # the base images stay cached; vfs keeps a full copy of every layer, so the build goes
      - buildah --root=/cache/storage rmi sbt2-server:ci

  # the protocol's conventions and golden fixtures, through prek, whose buf-build hook has buf
  - name: protocol-tests
    image: *image
    environment: *env
    volumes: [sbt2-cache-protocol-tests:/cache:z]
    depends_on: []
    when: *protocol
    commands:
      - uv --directory sbt2-protocol sync --locked
      - |
        for hook in buf-format buf-lint buf-breaking golden protocol-tests; do
          uvx prek@0.5.4 run "$hook" --all-files --show-diff-on-failure
        done

  # prost against the golden fixtures; protox compiles the .proto files, so no buf here
  - name: protocol-rust
    image: rust:1.97.1-slim-trixie
    environment:
      CARGO_HOME: /cache/cargo
      CARGO_TARGET_DIR: /cache/target
    volumes: [sbt2-cache-protocol-rust:/cache:z]
    depends_on: []
    when: *protocol
    commands:
      - cargo test --locked --manifest-path sbt2-protocol/checks/rust/Cargo.toml

  # the GUI's format, lint, unit and integration tests; cargo runs in sbt2-gui, where rust-toolchain.toml pins the image's toolchain
  - name: gui
    image: rust:1.97.1-slim-trixie
    environment:
      CARGO_HOME: /cache/cargo
      CARGO_TARGET_DIR: /cache/target
    volumes: [sbt2-cache-gui:/cache:z]
    depends_on: []
    when: *gui
    commands:
      - cd sbt2-gui
      - cargo fmt --all --check
      - cargo clippy --locked --all-targets -- -D warnings
      - cargo test --locked

  # the GUI's client against the real server; the rust image brings the toolchain, a pinned uv release brings Python
  - name: gui-e2e
    image: rust:1.97.1-slim-trixie
    environment:
      CARGO_HOME: /cache/cargo
      CARGO_TARGET_DIR: /cache/target
      UV_PYTHON_DOWNLOADS: automatic
      UV_PYTHON: "3.14"
      UV_PROJECT_ENVIRONMENT: /cache/venv
      XDG_CACHE_HOME: /cache
    volumes: [sbt2-cache-gui-e2e:/cache:z]
    depends_on: []
    when: *gui_e2e
    commands:
      - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates git
      - curl -fsSL -o /tmp/uv.tar.gz https://github.com/astral-sh/uv/releases/download/0.12.19/uv-x86_64-unknown-linux-gnu.tar.gz
      - echo "23bf5552d220e0842b65c862097b2ebaeba0064b74eda5e565e77fd25969d8c8  /tmp/uv.tar.gz" | sha256sum --check
      - tar -xzf /tmp/uv.tar.gz -C /usr/local/bin --strip-components=1
      - uv --directory sbt2-backend sync --locked
      - cd sbt2-gui
      - cargo test --locked -- --ignored
