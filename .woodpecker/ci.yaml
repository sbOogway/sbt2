when:
  - event: pull_request
  - event: push
    branch: main

variables:
  - &image ghcr.io/astral-sh/uv:0.12.19-python3.14-trixie
  - &env
    UV_LINK_MODE: copy
    UV_PYTHON_DOWNLOADS: never

steps:
  - name: lint
    image: *image
    environment: *env
    commands:
      - uv sync --locked
      - uvx pre-commit run --all-files --show-diff-on-failure

  - name: test
    image: *image
    environment: *env
    commands:
      - uv sync --locked
      - uv run --locked pytest --cov --cov-report=term --cov-report=xml -m "not live and not characterization and not realdata and not systemd"

  - name: coverage
    image: *image
    environment:
      <<: *env
      CODECOV_TOKEN:
        from_secret: codecov_token
    commands:
      - uvx --from codecov-cli==11.3.1 codecovcli upload-process --git-service github --file coverage.xml

  - name: characterization
    image: *image
    environment: *env
    commands:
      - uv sync --locked
      - uv run --locked pytest -m "characterization and not systemd"
