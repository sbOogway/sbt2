when:
  - event: pull_request
  - event: push
    branch: main

variables:
  - &image ghcr.io/astral-sh/uv:0.12.19-python3.14-trixie
  - &env
    UV_LINK_MODE: copy
    UV_PYTHON_DOWNLOADS: never

steps:
  - name: lint
    image: *image
    environment: *env
    commands:
      - uv sync --locked
      - uvx pre-commit run --all-files --show-diff-on-failure

  # one step, because this agent doesn't let a step read files another step's container wrote
  - name: test
    image: *image
    environment:
      <<: *env
      CODECOV_TOKEN:
        from_secret: codecov_token
    commands:
      - uv sync --locked
      # the test results go up even when tests fail, so Test Analytics sees the failures
      - |
        status=0
        # the tests have no use for the token
        env -u CODECOV_TOKEN uv run --locked pytest --cov --cov-report=term --cov-report=xml --junitxml=junit.xml -o junit_family=legacy -m "not live and not characterization and not realdata and not systemd" || status=$?
        uvx --from codecov-cli==11.3.1 codecovcli upload-process --git-service github --report-type test_results --flag tests --file junit.xml --disable-search
        uvx --from codecov-cli==11.3.1 codecovcli upload-process --git-service github --file coverage.xml
        exit $status

  - name: characterization
    image: *image
    environment:
      <<: *env
      CODECOV_TOKEN:
        from_secret: codecov_token
    commands:
      - uv sync --locked
      - |
        status=0
        env -u CODECOV_TOKEN uv run --locked pytest --junitxml=junit.xml -o junit_family=legacy -m "characterization and not systemd" || status=$?
        uvx --from codecov-cli==11.3.1 codecovcli upload-process --git-service github --report-type test_results --flag characterization --file junit.xml --disable-search
        exit $status
