when:
  - event: pull_request
  - event: push
    branch: main

steps:
  - name: lint
    image: ghcr.io/astral-sh/uv:0.12.19-python3.14-trixie
    environment:
      XDG_CACHE_HOME: /cache
    volumes: [sbt2-protocol-cache-lint:/cache:z]
    depends_on: []
    commands:
      # the test step runs them
      - SKIP=tests uvx prek@0.5.4 run --all-files --show-diff-on-failure

  # through prek, whose buf-build environment provides buf
  - name: test
    image: ghcr.io/astral-sh/uv:0.12.19-python3.14-trixie
    environment:
      XDG_CACHE_HOME: /cache
    volumes: [sbt2-protocol-cache-test:/cache:z]
    depends_on: []
    commands:
      - uvx prek@0.5.4 run tests --all-files

  # prost against the golden fixtures; protox compiles the .proto files, so no buf here
  - name: test-rust
    image: rust:1.97.1-slim-trixie
    environment:
      CARGO_HOME: /cache/cargo
      CARGO_TARGET_DIR: /cache/target
    volumes: [sbt2-protocol-cache-test-rust:/cache:z]
    depends_on: []
    commands:
      - cargo test --locked --manifest-path checks/rust/Cargo.toml
