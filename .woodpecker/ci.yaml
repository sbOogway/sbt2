when:
  - event: pull_request
  - event: push
    branch: main

variables:
  - &image ghcr.io/astral-sh/uv:0.12.19-python3.14-trixie
  - &env
    UV_LINK_MODE: copy
    UV_PYTHON_DOWNLOADS: never
    # uv, prek, pyright's Node.js and codecov-cli all keep their caches under it
    XDG_CACHE_HOME: /cache
  # shared by every step and pipeline; :z gives it SELinux's shared label, so each step's container can use it
  - &cache /home/mattia/.cache/woodpecker/sbt2:/cache:z

steps:
  - name: lint
    image: *image
    environment: *env
    volumes: [*cache]
    commands:
      - uv sync --locked
      - uvx pre-commit run --all-files --show-diff-on-failure

  # one step per job, because this agent doesn't let a step read files another step's container wrote
  - name: test-sbt2-core
    image: *image
    environment:
      <<: *env
      CODECOV_TOKEN:
        from_secret: codecov_token
    volumes: [*cache]
    commands:
      # only the member and what it declares, so an undeclared dependency fails here
      - uv sync --locked --package sbt2-core
      - |
        status=0
        env -u CODECOV_TOKEN uv run --locked --package sbt2-core pytest packages/sbt2-core/tests --cov --cov-config=packages/sbt2-core/pyproject.toml --cov-report=term --cov-report=xml --junitxml=junit.xml -o junit_family=legacy -m "not live and not characterization and not realdata and not systemd" || status=$?
        uvx --from codecov-cli==11.3.1 codecovcli upload-process --git-service github --report-type test_results --flag sbt2-core --file junit.xml --disable-search
        uvx --from codecov-cli==11.3.1 codecovcli upload-process --git-service github --flag sbt2-core --file coverage.xml
        exit $status

  - name: test-sbt2-strategies
    image: *image
    environment:
      <<: *env
      CODECOV_TOKEN:
        from_secret: codecov_token
    volumes: [*cache]
    commands:
      # only the member and what it declares, so an undeclared dependency fails here
      - uv sync --locked --package sbt2-strategies
      - |
        status=0
        env -u CODECOV_TOKEN uv run --locked --package sbt2-strategies pytest packages/sbt2-strategies/tests --cov --cov-config=packages/sbt2-strategies/pyproject.toml --cov-report=term --cov-report=xml --junitxml=junit.xml -o junit_family=legacy -m "not live and not characterization and not realdata and not systemd" || status=$?
        uvx --from codecov-cli==11.3.1 codecovcli upload-process --git-service github --report-type test_results --flag sbt2-strategies --file junit.xml --disable-search
        uvx --from codecov-cli==11.3.1 codecovcli upload-process --git-service github --flag sbt2-strategies --file coverage.xml
        exit $status

  # the root tests span the members, so they run with the whole workspace
  - name: test
    image: *image
    environment:
      <<: *env
      CODECOV_TOKEN:
        from_secret: codecov_token
    volumes: [*cache]
    commands:
      - uv sync --locked
      # the test results go up even when tests fail, so Test Analytics sees the failures
      - |
        status=0
        # the tests have no use for the token
        env -u CODECOV_TOKEN uv run --locked pytest tests --junitxml=junit.xml -o junit_family=legacy -m "not live and not characterization and not realdata and not systemd" || status=$?
        uvx --from codecov-cli==11.3.1 codecovcli upload-process --git-service github --report-type test_results --flag tests --file junit.xml --disable-search
        exit $status

  - name: characterization
    image: *image
    environment:
      <<: *env
      CODECOV_TOKEN:
        from_secret: codecov_token
    volumes: [*cache]
    commands:
      - uv sync --locked
      - |
        status=0
        env -u CODECOV_TOKEN uv run --locked pytest --junitxml=junit.xml -o junit_family=legacy -m "characterization and not systemd" || status=$?
        uvx --from codecov-cli==11.3.1 codecovcli upload-process --git-service github --report-type test_results --flag characterization --file junit.xml --disable-search
        exit $status
