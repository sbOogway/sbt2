when:
  - event: cron
    cron: live
  - event: manual

variables:
  - &image ghcr.io/astral-sh/uv:0.12.19-python3.14-trixie
  - &env
    UV_LINK_MODE: copy
    UV_PYTHON_DOWNLOADS: never
    XDG_CACHE_HOME: /cache
  - &cache sbt2-cache-live:/cache:z

steps:
  - name: bybit-latency
    image: curlimages/curl
    commands:
      - |
        for url in https://api.bybit.com/v5/market/time https://public.bybit.com/; do
          echo "$url"
          for i in 1 2 3 4 5; do
            curl -sS -o /dev/null -w "  http=%{http_code} dns=%{time_namelookup} tcp=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total}\n" "$url"
          done
        done

  - name: live
    image: *image
    environment: *env
    volumes: [*cache]
    commands:
      - uv sync --locked
      - uv run --locked pytest -m live

  # runs even when the live tests fail: an expiring pin must not wait on a flaky source
  - name: nautilus-bump
    image: *image
    environment:
      <<: *env
      DEBIAN_FRONTEND: noninteractive
      GIT_AUTHOR_NAME: woodpecker
      GIT_AUTHOR_EMAIL: woodpecker@mattiapapaccioli.com
      GIT_COMMITTER_NAME: woodpecker
      GIT_COMMITTER_EMAIL: woodpecker@mattiapapaccioli.com
      GH_TOKEN:
        from_secret: github_token
    commands:
      - apt-get update -qq && apt-get install -y -qq --no-install-recommends gh
      - gh auth setup-git
      - scripts/bump-nautilus.sh
    when:
      - status: [success, failure]
