when:
  - event: cron
    cron: nightly
  - event: manual

variables:
  - &image ghcr.io/astral-sh/uv:0.12.19-python3.14-trixie
  - &env
    UV_LINK_MODE: copy
    UV_PYTHON_DOWNLOADS: never

steps:
  - name: live
    image: *image
    environment: *env
    commands:
      - uv sync --locked
      - uv run --locked pytest -m live
