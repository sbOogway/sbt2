# The notebooks' environment. It installs this folder as an editable package,
# so "options.premium.portfolio" resolves from any kernel directory.
[project]
name = "sbt2-notebooks"
version = "0"
requires-python = ">=3.14"
dependencies = [
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.4",
    "sbt2-lab",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trend", "options"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
sbt2-lab = { path = "../sbt2-backend/packages/sbt2-lab", editable = true }

[tool.ruff]
extend = "../sbt2-backend/pyproject.toml"
