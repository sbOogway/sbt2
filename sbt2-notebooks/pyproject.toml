# The notebooks' environment. It installs this folder as an editable package,
# so "options.premium.portfolio" resolves from any kernel directory.
[project]
name = "sbt2-notebooks"
version = "0"
requires-python = ">=3.14"
dependencies = [
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.4",
    "sbt2-lab",
    "sbt2-strategies",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trend", "options", "vwap"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "nautech"
url = "https://packages.nautechsystems.io/simple"
explicit = true

[tool.uv.sources]
nautilus-trader = { index = "nautech" }
sbt2-lab = { path = "../sbt2-backend/packages/sbt2-lab", editable = true }
sbt2-strategies = { path = "../sbt2-backend/packages/sbt2-strategies", editable = true }
sbt2-core = { path = "../sbt2-backend/packages/sbt2-core", editable = true }
sbt2-data = { path = "../sbt2-backend/packages/sbt2-data", editable = true }

[tool.ruff]
extend = "../sbt2-backend/pyproject.toml"
