[project]
name = "sbt2-server"
dynamic = ["version"]
description = "The server behind sbt2's GUI, speaking protobuf over WebSocket"
license = "LGPL-3.0-or-later"
license-files = ["COPYING", "COPYING.LESSER"]
requires-python = ">=3.14"
# the generated code refuses a runtime older than the protoc that wrote it, or of another major
dependencies = ["protobuf>=7.36.2,<8"]

[build-system]
requires = ["hatchling>=1.27", "uv-dynamic-versioning>=0.8"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/sbt2"]
