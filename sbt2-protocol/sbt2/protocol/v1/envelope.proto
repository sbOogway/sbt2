syntax = "proto3";

package sbt2.protocol.v1;

import "sbt2/protocol/v1/config.proto";
import "sbt2/protocol/v1/results.proto";
import "sbt2/protocol/v1/runs.proto";
import "sbt2/protocol/v1/types.proto";

// Each binary WebSocket frame the client sends is one ClientMessage.
message ClientMessage {
  // Chosen by the client and never 0; the server's answers carry it back.
  uint64 request_id = 1;
  oneof body {
    Hello hello = 2;
    ListRuns list_runs = 3;
    GetRun get_run = 4;
    GetMetrics get_metrics = 5;
    GetSeries get_series = 6;
    GetTearsheet get_tearsheet = 7;
    ListVenueProfiles list_venue_profiles = 8;
    PutVenueProfile put_venue_profile = 9;
    DeleteVenueProfile delete_venue_profile = 10;
    ListKnownGaps list_known_gaps = 11;
    AddKnownGaps add_known_gaps = 12;
    RemoveKnownGaps remove_known_gaps = 13;
    ListModelKinds list_model_kinds = 14;
    SubmitRun submit_run = 15;
    CancelJob cancel_job = 16;
    ListJobs list_jobs = 17;
    SubscribeJob subscribe_job = 18;
    Unsubscribe unsubscribe = 19;
  }
}

// Each binary WebSocket frame the server sends is one ServerMessage.
message ServerMessage {
  // 0 on a push, which carries the subscription it belongs to instead.
  uint64 request_id = 1;
  // 0 on an answer to a request.
  uint64 subscription_id = 2;
  oneof body {
    Error error = 3;
    Welcome welcome = 4;
    RunList run_list = 5;
    RunSummary run_summary = 6;
    Metrics metrics = 7;
    Series series = 8;
    Tearsheet tearsheet = 9;
    VenueProfiles venue_profiles = 10;
    ConfigWritten config_written = 11;
    KnownGaps known_gaps = 12;
    ModelKinds model_kinds = 13;
    JobSubmitted job_submitted = 14;
    JobCancelled job_cancelled = 15;
    Jobs jobs = 16;
    JobSubscribed job_subscribed = 17;
    JobUpdate job_update = 18;
    Unsubscribed unsubscribed = 19;
  }
}

// The client's first message on a connection.
message Hello {
  string client_version = 1;
}

// The answer to Hello.
message Welcome {
  string server_version = 1;
  repeated Capability capabilities = 2;
}

enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  CAPABILITY_RESULTS = 1;
  CAPABILITY_CONFIG = 2;
  CAPABILITY_RUNS = 3;
}
