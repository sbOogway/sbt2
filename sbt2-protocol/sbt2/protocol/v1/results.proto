syntax = "proto3";

package sbt2.protocol.v1;

import "google/protobuf/timestamp.proto";

message RunIds {
  repeated string values = 1;
}

message RunFilter {
  optional string strategy = 1;
  optional string part = 2;
  optional string batch = 3;
  optional string study = 4;
  // Absent selects all IDs; present and empty selects none.
  RunIds run_ids = 5;
}

message ListRuns {
  RunFilter filter = 1;
}

message GetRun {
  string run_id = 1;
}

message HeadlineMetrics {
  optional string net_return = 1;
  optional string annualized_return = 2;
  optional string sharpe = 3;
  optional string max_drawdown = 4;
  uint64 trade_count = 5;
  string total_fees = 6;
  string total_carry = 7;
}

message RunSummary {
  string run_id = 1;
  optional string batch_id = 2;
  optional string study = 3;
  string spec_hash = 4;
  string strategy = 5;
  // JSON retains the parameter and split documents' heterogeneous value types.
  string params_json = 6;
  repeated string instruments = 7;
  google.protobuf.Timestamp start_at = 8;
  google.protobuf.Timestamp end_at = 9;
  string split_json = 10;
  string part = 11;
  repeated string known_gaps = 12;
  string currency = 13;
  HeadlineMetrics headline = 14;
  google.protobuf.Timestamp drawdown_tripped_at = 15;
}

message RunList {
  uint64 index = 1;
  bool last = 2;
  repeated RunSummary runs = 3;
}

message ListStudies {}

message StudySummary {
  string name = 1;
  string strategy = 2;
  uint64 run_count = 3;
}

message StudyList {
  uint64 index = 1;
  bool last = 2;
  repeated StudySummary studies = 3;
}

message GetStudy {
  string name = 1;
}

message StudyRun {
  string run_id = 1;
  string part = 2;
  // A JSON object of the parameters that vary across the study's runs.
  string varying_params_json = 3;
  HeadlineMetrics headline = 4;
}

message StudyDetail {
  uint64 index = 1;
  bool last = 2;
  // name, strategy, context_json and source are set only in the chunk with index 0.
  string name = 3;
  string strategy = 4;
  // A JSON object: the context every run of the study shares.
  string context_json = 5;
  // The module source the study pinned.
  string source = 6;
  repeated StudyRun runs = 7;
}

message GetMetrics {
  string run_id = 1;
}

enum MetricGroup {
  METRIC_GROUP_UNSPECIFIED = 0;
  METRIC_GROUP_PNLS = 1;
  METRIC_GROUP_RETURNS = 2;
  METRIC_GROUP_GENERAL = 3;
  METRIC_GROUP_INSTRUMENT_PNLS = 4;
  METRIC_GROUP_PROBABILISTIC_SHARPE = 5;
}

message Metric {
  MetricGroup group = 1;
  string name = 2;
  // Absent means undefined, not zero. Finite values are decimal strings.
  optional string value = 3;
  optional string instrument_id = 4;
}

message Metrics {
  uint64 index = 1;
  bool last = 2;
  string currency = 3;
  repeated Metric entries = 4;
}

enum SeriesKind {
  SERIES_KIND_UNSPECIFIED = 0;
  SERIES_KIND_EQUITY = 1;
  SERIES_KIND_FILLS = 2;
}

message GetSeries {
  string run_id = 1;
  SeriesKind kind = 2;
}

message Series {
  uint64 index = 1;
  bool last = 2;
  // Concatenate all chunks before decoding the Arrow IPC stream.
  bytes data = 3;
}

enum BenchmarkKind {
  BENCHMARK_KIND_UNSPECIFIED = 0;
  BENCHMARK_KIND_DEFAULT = 1;
  BENCHMARK_KIND_NONE = 2;
  BENCHMARK_KIND_BUY_AND_HOLD = 3;
  BENCHMARK_KIND_EQUAL_WEIGHT = 4;
}

message BenchmarkSelection {
  // UNSPECIFIED and an absent selection both mean the strategy's default.
  BenchmarkKind kind = 1;
  // Only valid for BUY_AND_HOLD; absent uses the run's first instrument.
  optional string instrument_id = 2;
}

message GetTearsheet {
  string run_id = 1;
  BenchmarkSelection benchmark = 2;
}

message Tearsheet {
  uint64 index = 1;
  bool last = 2;
  // Concatenate all chunks to recover the UTF-8 HTML document.
  bytes data = 3;
}

enum PanelKind {
  PANEL_KIND_UNSPECIFIED = 0;
  PANEL_KIND_RETURNS = 1;
  PANEL_KIND_BENCHMARK_RETURNS = 2;
  PANEL_KIND_DRAWDOWN = 3;
  PANEL_KIND_MONTHLY_RETURNS = 4;
  PANEL_KIND_YEARLY_RETURNS = 5;
  PANEL_KIND_ROLLING_SHARPE = 6;
}

message GetPanel {
  string run_id = 1;
  PanelKind kind = 2;
  // Only BENCHMARK_RETURNS uses it; the rules are GetTearsheet's.
  BenchmarkSelection benchmark = 3;
}

message Panel {
  uint64 index = 1;
  bool last = 2;
  // Concatenate all chunks before decoding the Arrow IPC stream. It has the
  // columns ts (UTC timestamp) and value (float64, a fraction, not percent).
  bytes data = 3;
}
