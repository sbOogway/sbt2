syntax = "proto3";

package sbt2.protocol.v1;

// Lives here rather than in envelope.proto so that area files can embed it without an import cycle.
message Error {
  ErrorCode code = 1;
  string message = 2;
  map<string, string> details = 3;
  oneof detail {
    StudyConflict study_conflict = 4;
  }
}

// Why a run does not fit the study it names; the code is ERROR_CODE_INVALID_ARGUMENT.
message StudyConflict {
  StudyConflictKind kind = 1;
  // CONTEXT only: the context keys whose values differ from the study's.
  repeated string context_keys = 2;
  // DUPLICATE_RUN only: the study's run with the same parameters.
  optional string run_id = 3;
}

enum StudyConflictKind {
  STUDY_CONFLICT_KIND_UNSPECIFIED = 0;
  // The run's context differs from the study's.
  STUDY_CONFLICT_KIND_CONTEXT = 1;
  // The strategy's source differs from the one the study pinned.
  STUDY_CONFLICT_KIND_CODE = 2;
  // The study already holds a run with the same parameters.
  STUDY_CONFLICT_KIND_DUPLICATE_RUN = 3;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  // The frame is not a ClientMessage, or its body is unset.
  ERROR_CODE_INVALID_MESSAGE = 1;
  ERROR_CODE_INVALID_ARGUMENT = 2;
  ERROR_CODE_NOT_FOUND = 3;
  // The server does not handle this body.
  ERROR_CODE_UNIMPLEMENTED = 4;
  ERROR_CODE_UNSUPPORTED_VERSION = 5;
  ERROR_CODE_INTERNAL = 6;
  // One indivisible response record exceeds the maximum envelope size.
  ERROR_CODE_RESOURCE_EXHAUSTED = 7;
}
