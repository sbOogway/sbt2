version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      # nautilus-trader is pinned to a dev build whose updates often break the API,
      # so it stays in a pull request of its own
      python:
        patterns: ["*"]
        exclude-patterns: [nautilus-trader]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      hooks:
        patterns: ["*"]
