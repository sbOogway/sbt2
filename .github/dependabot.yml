version: 2

updates:
  - package-ecosystem: uv
    directory: /sbt2-backend
    schedule:
      interval: daily
    commit-message:
      prefix: build
      include: scope
    ignore:
      # nautilus-trader uses the Nautech nightly index and is bumped by scripts/bump-nautilus.sh.
      - dependency-name: nautilus-trader
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: ci
    groups:
      hooks:
        patterns: ["*"]
