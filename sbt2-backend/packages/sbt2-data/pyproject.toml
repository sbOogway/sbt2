[project]
name = "sbt2-data"
dynamic = ["version"]
description = "Downloads, ingests and catalogs market data"
license = "LGPL-3.0-or-later"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "nautilus-trader==2.0.0rc7.dev20261005",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "tomli-w>=1.2.0",
]

[build-system]
requires = ["hatchling>=1.27", "uv-dynamic-versioning>=0.8"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/sbt2"]

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0"]

[tool.coverage.run]
source_pkgs = ["sbt2.data"]
omit = ["*/sbt2/data/testing/*"]
branch = true
concurrency = ["multiprocessing"]
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 85
show_missing = true
