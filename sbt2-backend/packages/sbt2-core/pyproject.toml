[project]
name = "sbt2-core"
dynamic = ["version", "dependencies"]
description = "Backtesting framework on nautilus_trader"
license = "LGPL-3.0-or-later"
license-files = ["COPYING", "COPYING.LESSER"]
requires-python = ">=3.14"

[build-system]
requires = ["hatchling>=1.27", "uv-dynamic-versioning>=0.8"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.metadata.hooks.uv-dynamic-versioning]
dependencies = [
    "duckdb>=1.5.6",
    "jeepney>=0.9.0",
    "nautilus-trader[visualization]==2.0.0rc7.dev20261005",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "sbt2-data=={{ version }}",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sbt2"]

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0"]

[tool.coverage.run]
source_pkgs = ["sbt2.core"]
branch = true
concurrency = ["multiprocessing"]
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 85
show_missing = true
