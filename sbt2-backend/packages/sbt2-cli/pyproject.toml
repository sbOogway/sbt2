[project]
name = "sbt2-cli"
dynamic = ["version", "dependencies"]
description = "The sbt2 command"
license = "LGPL-3.0-or-later"
license-files = ["COPYING", "COPYING.LESSER"]
requires-python = ">=3.14"

[tool.hatch.metadata.hooks.uv-dynamic-versioning]
dependencies = [
    "sbt2-core=={{ version }}",
    "typer>=0.27.2",
]

[project.scripts]
sbt2 = "sbt2.cli:app"

[build-system]
requires = ["hatchling>=1.27", "uv-dynamic-versioning>=0.8"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/sbt2"]

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0"]

[tool.coverage.run]
source_pkgs = ["sbt2.cli"]
branch = true
concurrency = ["multiprocessing"]
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 85
show_missing = true
