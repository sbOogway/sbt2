[project]
name = "sbt2-papers"
dynamic = ["version"]
description = "Research papers to structured, source-grounded records"
license = "LGPL-3.0-or-later"
license-files = ["COPYING", "COPYING.LESSER"]
requires-python = ">=3.14"
dependencies = ["pydantic>=2.13"]

[build-system]
requires = ["hatchling>=1.27", "uv-dynamic-versioning>=0.8"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/sbt2"]

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0"]

[tool.coverage.run]
source_pkgs = ["sbt2.papers"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
