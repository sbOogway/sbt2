[project]
name = "sbt2"
dynamic = ["version", "dependencies", "optional-dependencies"]
description = "Backtesting framework on nautilus_trader"
license = "LGPL-3.0-or-later"
license-files = ["COPYING", "COPYING.LESSER"]
requires-python = ">=3.14"

[build-system]
requires = ["hatchling>=1.27", "uv-dynamic-versioning>=0.8"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.metadata.hooks.uv-dynamic-versioning]
dependencies = [
    "sbt2-core=={{ version }}",
    "sbt2-data=={{ version }}",
    "sbt2-cli=={{ version }}",
    "sbt2-strategies=={{ version }}",
]

[tool.hatch.metadata.hooks.uv-dynamic-versioning.optional-dependencies]
papers = ["sbt2-papers=={{ version }}"]
server = ["sbt2-server=={{ version }}"]
all = ["sbt2-papers=={{ version }}", "sbt2-server=={{ version }}"]

# a meta distribution: it only pulls in the members
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.sdist]
include = ["/pyproject.toml", "/README.md", "/COPYING", "/COPYING.LESSER"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "nautech"
url = "https://packages.nautechsystems.io/simple"
explicit = true

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
nautilus-trader = { index = "nautech" }
sbt2-core = { workspace = true }
sbt2-data = { workspace = true }
sbt2-cli = { workspace = true }
sbt2-strategies = { workspace = true }
sbt2-papers = { workspace = true }
sbt2-server = { workspace = true }

[dependency-groups]
dev = [
    "grpcio-tools>=1.84.0",
    "import-linter>=2.15",
    "mypy-protobuf>=5.1.0",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "sbt2-cli",
    "sbt2-papers",
    "sbt2-server",
]

[tool.pyright]
include = ["packages", "tests"]
# the core tests share helpers with the root tests
extraPaths = [
    "tests",
    "packages/sbt2-core/tests",
    "packages/sbt2-cli/tests",
    "packages/sbt2-data/tests",
    "packages/sbt2-data/tests/catalog",
    "packages/sbt2-data/tests/sources",
    "packages/sbt2-core/tests/results",
    "packages/sbt2-core/tests/run",
]
reportDeprecated = "error"

# mypy-protobuf's stubs narrow Message.DESCRIPTOR, which typeshed declares as a union;
# mypy-protobuf turns this rule off for generated code too
[[tool.pyright.executionEnvironments]]
root = "packages/sbt2-server/src/sbt2/protocol"
reportIncompatibleVariableOverride = false

[tool.ruff]
src = ["packages/*/src"]

[tool.ruff.lint]
extend-select = [
    "ARG", "B", "C4", "C90", "DTZ", "ERA", "FBT", "FURB", "G", "LOG", "PERF", "PGH", "PIE",
    "PLR0913", "PLR0915", "PLR0917", "PLR2004", "PT", "PTH", "RET", "RUF", "SIM",
    "S", "SLF", "T20", "TID", "UP",
]
ignore = [
    # nautilus constructors take their flags positionally
    "FBT003",
    # concatenation splits a long CLI argument list into rows of related options
    "RUF005",
]

[tool.ruff.lint.per-file-ignores]
# Typer reads each command option from a parameter of its own
"packages/*/src/sbt2/*/cli.py" = ["FBT001", "FBT002", "PLR0913", "PLR0917"]
"packages/sbt2-cli/src/sbt2/cli/*.py" = ["FBT001", "FBT002", "PLR0913", "PLR0917"]
# pytest hands fixtures in as arguments
"**/test_*.py" = ["PLR0913", "PLR0917"]
"**/conftest.py" = ["PLR0913", "PLR0917"]
# tests spell out their expected values; the security rules guard shipped code
"**/tests/**" = ["PLR2004", "S"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 3
max-positional-args = 3

[tool.importlinter]
root_packages = ["sbt2.data", "sbt2.core", "sbt2.cli", "sbt2.strategies", "sbt2.papers", "sbt2.server", "sbt2.protocol"]
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Higher packages may import lower ones, never the reverse"
type = "layers"
layers = [
    "sbt2.core.run",
    "sbt2.core.results",
    "sbt2.core.spec",
    "sbt2.core.strategy | sbt2.core.assets | sbt2.core.config",
    "sbt2.data",
]

[[tool.importlinter.contracts]]
name = "Only sbt2.core.assets imports its own internals"
type = "protected"
protected_modules = ["sbt2.core.assets.*"]
allowed_importers = ["sbt2.core.assets"]

[[tool.importlinter.contracts]]
name = "Only sbt2.data imports its own internals"
type = "protected"
protected_modules = [
    "sbt2.data.catalog",
    "sbt2.data.catalog.*",
    "sbt2.data.days",
    "sbt2.data.days.*",
    "sbt2.data.downloading",
    "sbt2.data.downloading.*",
    "sbt2.data.ingesting",
    "sbt2.data.ingesting.*",
    "sbt2.data.sources",
    "sbt2.data.sources.*",
    "sbt2.data.tally",
    "sbt2.data.tally.*",
]
allowed_importers = ["sbt2.data"]

[[tool.importlinter.contracts]]
name = "Only sbt2.core.results imports its own internals"
type = "protected"
protected_modules = ["sbt2.core.results.*"]
allowed_importers = ["sbt2.core.results"]

[[tool.importlinter.contracts]]
name = "Higher parts of sbt2.core.results may import lower ones, never the reverse"
type = "layers"
containers = ["sbt2.core.results"]
layers = [
    "report",
    "comparisons",
    "store | costs",
    "pricing",
    "metrics",
]

[[tool.importlinter.contracts]]
name = "Only sbt2.core.results.costs imports its own internals"
type = "protected"
protected_modules = ["sbt2.core.results.costs.*"]
allowed_importers = ["sbt2.core.results.costs"]

[[tool.importlinter.contracts]]
name = "Only sbt2.core.results.metrics imports its own internals"
type = "protected"
protected_modules = ["sbt2.core.results.metrics.*"]
allowed_importers = ["sbt2.core.results.metrics"]

[[tool.importlinter.contracts]]
name = "Only sbt2.core.results.pricing imports its own internals"
type = "protected"
protected_modules = ["sbt2.core.results.pricing.*"]
allowed_importers = ["sbt2.core.results.pricing"]

[[tool.importlinter.contracts]]
name = "Only sbt2.core.results.report imports its own internals"
type = "protected"
protected_modules = ["sbt2.core.results.report.*"]
allowed_importers = ["sbt2.core.results.report"]

[[tool.importlinter.contracts]]
name = "Only sbt2.core.results.store imports its own internals"
type = "protected"
protected_modules = ["sbt2.core.results.store.*"]
allowed_importers = ["sbt2.core.results.store"]

[[tool.importlinter.contracts]]
name = "Only sbt2.core.results.store.parquet imports its own internals"
type = "protected"
protected_modules = ["sbt2.core.results.store.parquet.*"]
allowed_importers = ["sbt2.core.results.store.parquet"]

[[tool.importlinter.contracts]]
name = "Only sbt2.core.run imports its own internals"
type = "protected"
protected_modules = ["sbt2.core.run.*"]
allowed_importers = ["sbt2.core.run"]

[[tool.importlinter.contracts]]
name = "Only sbt2.core.run.batching imports its own internals"
type = "protected"
protected_modules = ["sbt2.core.run.batching.*"]
allowed_importers = ["sbt2.core.run.batching"]

[[tool.importlinter.contracts]]
name = "Only sbt2.core.run.child imports its own internals"
type = "protected"
protected_modules = ["sbt2.core.run.child.*"]
allowed_importers = ["sbt2.core.run.child"]

[[tool.importlinter.contracts]]
name = "Only sbt2.core.run.launchers imports its own internals"
type = "protected"
protected_modules = ["sbt2.core.run.launchers.*"]
allowed_importers = ["sbt2.core.run.launchers"]

[[tool.importlinter.contracts]]
name = "Only sbt2.core.run.preflighting imports its own internals"
type = "protected"
protected_modules = ["sbt2.core.run.preflighting.*"]
allowed_importers = ["sbt2.core.run.preflighting"]

[[tool.importlinter.contracts]]
name = "Only sbt2.core.spec imports its own internals"
type = "protected"
protected_modules = ["sbt2.core.spec.*"]
allowed_importers = ["sbt2.core.spec"]

[[tool.importlinter.contracts]]
name = "Only sbt2.core.strategy imports its own internals"
type = "protected"
protected_modules = ["sbt2.core.strategy.*"]
allowed_importers = ["sbt2.core.strategy"]

[[tool.importlinter.contracts]]
name = "Only sbt2.server.transport imports its own internals"
type = "protected"
protected_modules = ["sbt2.server.transport.*"]
allowed_importers = ["sbt2.server.transport"]

[[tool.importlinter.contracts]]
name = "Only sbt2.server.results imports its own internals"
type = "protected"
protected_modules = ["sbt2.server.results.*"]
allowed_importers = ["sbt2.server.results"]

[[tool.importlinter.contracts]]
name = "Only sbt2.server.config imports its own internals"
type = "protected"
protected_modules = ["sbt2.server.config.*"]
allowed_importers = ["sbt2.server.config"]

[[tool.importlinter.contracts]]
name = "Only sbt2.server.strategies imports its own internals"
type = "protected"
protected_modules = ["sbt2.server.strategies.*"]
allowed_importers = ["sbt2.server.strategies"]

[[tool.importlinter.contracts]]
name = "sbt2 never imports the server or its protocol"
type = "forbidden"
source_modules = ["sbt2.core", "sbt2.strategies", "sbt2.papers"]
forbidden_modules = ["sbt2.server", "sbt2.protocol"]

[[tool.importlinter.contracts]]
name = "The libraries never import the CLI"
type = "forbidden"
source_modules = ["sbt2.core", "sbt2.strategies", "sbt2.papers", "sbt2.server"]
forbidden_modules = ["sbt2.cli"]

[[tool.importlinter.contracts]]
name = "The protocol is generated code and imports nothing of sbt2"
type = "forbidden"
source_modules = ["sbt2.protocol"]
forbidden_modules = ["sbt2.core", "sbt2.cli", "sbt2.strategies", "sbt2.papers", "sbt2.server"]

[[tool.importlinter.contracts]]
name = "sbt2 never imports the paper pipeline"
type = "forbidden"
source_modules = ["sbt2.core", "sbt2.strategies"]
forbidden_modules = ["sbt2.papers"]

[[tool.importlinter.contracts]]
name = "The paper pipeline never imports sbt2"
type = "forbidden"
source_modules = ["sbt2.papers"]
forbidden_modules = ["sbt2.core", "sbt2.strategies"]

[tool.pytest.ini_options]
testpaths = [
    "packages/sbt2-core/tests",
    "packages/sbt2-cli/tests",
    "packages/sbt2-data/tests",
    "packages/sbt2-strategies/tests",
    "packages/sbt2-server/tests",
    "packages/sbt2-papers/tests",
    "tests",
]
# importlib mode leaves sys.path alone, so the folders that hold helper modules are listed
pythonpath = [
    "tests",
    "tests/characterization/nautilus",
    "tests/golden",
    "packages/sbt2-core/tests",
    "packages/sbt2-data/tests",
    "packages/sbt2-data/tests/catalog",
    "packages/sbt2-data/tests/sources",
    "packages/sbt2-core/tests/results",
    "packages/sbt2-core/tests/run",
    "packages/sbt2-core/tests/spec",
    "packages/sbt2-core/tests/strategy",
    "packages/sbt2-cli/tests",
    "packages/sbt2-strategies/tests",
    "packages/sbt2-server/tests",
    "packages/sbt2-papers/tests",
]
addopts = [
    "--import-mode=importlib",
    "-p", "pytest_sbt2",
    "-m", "not live and not realdata and not systemd and not container",
]
filterwarnings = ["error"]
markers = [
    "unit: exercises one module on its own, with test doubles or fixture data for the rest",
    "integration: exercises modules working together, or strategies and data inside a running Nautilus engine",
    "e2e: drives a command through the CLI, from spec or raw files to stored output",
    "characterization: pins behavior of a third-party dependency sbt2 relies on",
    "golden: a fixed spec that must keep producing the same numbers",
    "live: reaches a real data source over the network; run with -m live",
    "realdata: runs on a month of real data in data/, fetching what it lacks; run with -m realdata",
    "systemd: needs a systemd user session on its D-Bus session bus; run with -m systemd",
    "container: builds and runs the server's container image with podman; run with -m container",
]

[tool.coverage.run]
source_pkgs = ["sbt2.data", "sbt2.core", "sbt2.cli", "sbt2.strategies", "sbt2.papers", "sbt2.server"]
branch = true
concurrency = ["multiprocessing"]
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 85
show_missing = true
